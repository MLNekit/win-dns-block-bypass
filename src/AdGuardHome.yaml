http:
  pprof:
    port: 6060
    enabled: false
  doh:
    routes:
      - GET /dns-query
      - POST /dns-query
      - GET /dns-query/{ClientID}
      - POST /dns-query/{ClientID}
    insecure_enabled: false
  address: 0.0.0.0:80
  session_ttl: 1d
users:
  - name: admin
    password: $2a$10$gJpZGKR6IUrJZtPJ2xkomuooDY3dDlzbeVbIPRJOVDcbhFPYLpzfy
auth_attempts: 5
block_auth_min: 15
http_proxy: ""
language: ""
theme: auto
