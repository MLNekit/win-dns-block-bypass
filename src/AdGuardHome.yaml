  bootstrap_dns:
    - 9.9.9.9
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - 8.8.4.4
  fallback_dns:
    - tls://one.one.one.one
    - tls://dns.google
    - tls://dns.adguard-dns.com
    - quic://dns.adguard-dns.com
    - tcp://1.1.1.1
    - tcp://1.0.0.1
    - tcp://8.8.8.8
    - tcp://8.8.4.4
    - tls://dns.quad9.net
    - tls://dns.quad9.net
  upstream_mode: load_balance
  fastest_timeout: 1s
  allowed_clients:
