    - '[/chatgpt.com/]https://xbox-dns.ru/dns-query'
    - '[/searchgpt.com/]https://xbox-dns.ru/dns-query'
    - '[/chat.com/]https://xbox-dns.ru/dns-query'
    - '[/oaiusercontent.com/]https://xbox-dns.ru/dns-query'
    - '[/oaistatic.com/]https://xbox-dns.ru/dns-query'
    - '[/anthropic.com/]https://xbox-dns.ru/dns-query'
    - '[/claude.ai/]https://xbox-dns.ru/dns-query'
    - '[/gemini.google.com/]https://xbox-dns.ru/dns-query'
    - '[/ai.google.dev/]https://xbox-dns.ru/dns-query'
    - '[/generativelanguage.googleapis.com/]https://xbox-dns.ru/dns-query'
    - '[/copilot.microsoft.com/]https://xbox-dns.ru/dns-query'
